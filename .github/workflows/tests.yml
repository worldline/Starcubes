# Tests on every branch push and pull request. The release workflow has its
# own copy of the Python job, because it runs on tags and must gate the image
# build; this one is the everyday feedback loop.
name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: starcubes
          POSTGRES_PASSWORD: starcubes
          POSTGRES_DB: starcubes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starcubes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      STARCUBES_TEST_DSN: postgresql+psycopg2://starcubes:starcubes@127.0.0.1:5432/starcubes
      STARCUBES_SECRET_KEY: test-secret
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium

      - name: Run pytest (DB + browser tests included)
        run: python -m pytest -q

  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test:js
