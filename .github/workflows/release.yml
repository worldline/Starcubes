# The release pipeline. Pushing a `v*` tag publishes the release this repo
# used to cut by hand — see docs/releases.md, "Releasing from GitHub":
# the image on ghcr.io, a source zip packed from the tag, and a release
# whose body is the tag's own CHANGELOG.md section.
#
# starcubes/version.py stays the one definition of what a version is: the
# job asks it — not the tag name — for the version, and stops unless the
# two agree. The changelog guard runs before the build, so a missing
# section costs a minute, not a full image build.
name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v2.0.0-beta.3
        required: true

permissions:
  contents: write
  packages: write

jobs:
  # The release build is not started until the same Python suite has passed on
  # the tagged commit. The everyday copy lives in tests.yml; this one exists
  # because a workflow cannot depend on another workflow's job.
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: starcubes
          POSTGRES_PASSWORD: starcubes
          POSTGRES_DB: starcubes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starcubes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      STARCUBES_TEST_DSN: postgresql+psycopg2://starcubes:starcubes@127.0.0.1:5432/starcubes
      STARCUBES_SECRET_KEY: test-secret
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      # The chart page loads the vendored bundle from
      # viz/static/timeseries/, which is generated (and gitignored) — a
      # checkout has no copy. Without it the browser tests time out waiting
      # for the plot.json fetch the page never starts.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Vendor timeseries.js
        run: |
          npm ci --omit=dev --no-audit --no-fund
          mkdir -p viz/static/timeseries
          cp node_modules/@hgruber/timeseries.js/dist/timeseries.min.js \
             viz/static/timeseries/timeseries.js
          cp node_modules/@hgruber/timeseries.js/LICENSE \
             viz/static/timeseries/LICENSE

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium

      - name: Run pytest
        run: python -m pytest -q

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag (full history — the version comes from the tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Resolve the version with starcubes/version.py
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(python3 -c 'from starcubes.version import __version__; print(__version__)')
          case "$version" in
            "" | "unknown")
              echo "version.py could not resolve a version — is $tag on the remote?" >&2
              exit 1 ;;
            "${tag#v}") ;;
            *)
              echo "version.py says '$version', but the tag is '$tag'" >&2
              echo "  — refusing to publish a release whose version and tag disagree" >&2
              exit 1 ;;
          esac
          echo "tag=$tag"          >> "$GITHUB_ENV"
          echo "version=$version"   >> "$GITHUB_ENV"
          # Same rule as version.py._is_prerelease: a hyphen before the '+'
          case "${version%%+*}" in
            *-*) echo "prerelease=true"  >> "$GITHUB_ENV" ;;
            *)   echo "prerelease=false" >> "$GITHUB_ENV" ;;
          esac

      - name: Extract the changelog section
        run: |
          # $RUNNER_TEMP keeps the workspace clean: anything written here is
          # untracked, and version.py reads `git status` when build.sh runs —
          # a dirty tree would silently tag the image `…+dirty`.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; print; next }
            on && substr($0, 1, 3) == "## " { exit }
            on
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || {
            echo "CHANGELOG.md has no '## [$version]' section —" >&2
            echo "  write it and commit it before tagging (docs/releases.md, step 2)" >&2
            exit 1
          }

      - name: Pack the source zip from the tag
        run: git archive --format=zip "$tag" -o "$RUNNER_TEMP/starcubes-$version.zip"

      - name: Build the image
        run: CONTAINER_ENGINE=docker ./docker/build.sh

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push the image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"   # ghcr names are lowercase
          docker tag "starcubes:$version" "$image:$version"
          docker push "$image:$version"
          # :latest says "the newest final release" — a beta must not move it
          if [ "$prerelease" = false ]; then
            docker tag "starcubes:$version" "$image:latest"
            docker push "$image:latest"
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          zip_name="starcubes-$version.zip"     # the asset's name on the release
          zip_path="$RUNNER_TEMP/$zip_name"     # where the file actually lives
          args=(--title "starcubes $version" --notes-file "$notes" "$zip_path")
          if [ "$prerelease" = true ]; then args+=(--prerelease); fi
          gh release create "$tag" "${args[@]}"