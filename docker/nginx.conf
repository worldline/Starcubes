worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /var/log/nginx/error.log warn;

# Rootless podman: no root to escalate to, so skip setuid/setgid.
daemon off;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    log_format main '$remote_addr - $request_id [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '$request_time';

    access_log /var/log/nginx/access.log main;

    server {
        listen 8080 default_server;
        listen [::]:8080;
        server_name _;

        client_max_body_size 10m;

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            uwsgi_pass uwsgi;
            include uwsgi_params;
            # Debian's uwsgi_params sets `HTTP_HOST $host` since a security
            # update; $host drops the client-supplied port. Django derives both
            # the CSRF "good origin" and the OIDC redirect_uri from
            # request.get_host(), so without the port every browser POST fails
            # the Origin check (403) and Keycloak rejects redirect_uri as a
            # mismatch. $http_host restores the header as sent.
            # The raw Host header is only safe because Django validates it
            # against ALLOWED_HOSTS — STARCUBES_ALLOWED_HOSTS must therefore
            # name the real hostnames, not `*`, on any reachable deployment.
            # (nginx's own $host$is_request_port$request_port needs 1.30+; the
            # image ships 1.22.1.)
            uwsgi_param HTTP_HOST $http_host;
            uwsgi_param REQUEST_ID $request_id;
            uwsgi_read_timeout 120;
        }
    }

    upstream uwsgi {
        server 127.0.0.1:3031;
    }
}