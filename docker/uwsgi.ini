[uwsgi]
strict = true
master = true
module = starcubes.wsgi:application
chdir = /app

processes = 2
threads = 4
socket = 127.0.0.1:3031
chmod-socket = 666
vacuum = true
die-on-term = true

static-map = /static=/app/staticfiles
harakiri = 120
max-requests = 5000
disable-logging = true
log-4xx = true
log-5xx = true