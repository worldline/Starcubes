# The release pipeline, GitLab side. Its GitHub twin is
# .github/workflows/release.yml, and the two are deliberately kept in step:
# same guards, same order, same output — see docs/releases.md, "Releasing
# from a remote". A `v*` tag pushed to this remote publishes the image, a
# source zip packed from the tag, and a release whose body is the tag's own
# CHANGELOG.md section.
#
# starcubes/version.py stays the one definition of what a version is: the
# job asks it — not the tag name — for the version, and stops unless the
# two agree. The changelog guard runs before the build, so a missing
# section costs a minute, not a full image build.
#
# Three things GitLab does differently, all of them handled below rather
# than papered over:
#   * a release carries links, not file uploads — the zip goes into the
#     generic package registry and is linked from the release;
#   * there is no pre-release flag — the name says it, and `:latest` is
#     what actually keeps a beta from being pulled by accident;
#   * artifacts must live inside $CI_PROJECT_DIR, which is the checkout —
#     see the note on .release/ in the build job.

# Tag pipelines only. Nothing here belongs on a branch push: the whole file
# is one release procedure, and a job that cannot resolve a tag cannot run
# any of it.
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/

variables:
  # version.py asks `git describe --abbrev=0 --match 'v[0-9]*'`, which needs
  # the tag history. GitLab clones shallow by default, and a shallow clone
  # resolves the version to `unknown` — the guard below would then stop the
  # release for what is really a checkout setting. Full depth, always.
  GIT_DEPTH: "0"

  # docker/build.sh takes the engine from here, so a shell runner with
  # podman is a variable change rather than an edit: set CONTAINER_ENGINE
  # to `podman` and drop the dind service from the build job.
  CONTAINER_ENGINE: docker

  # Where the image goes. Nothing else in the tree names a registry — the
  # image's identity is its build args and OCI labels, not its name — so
  # this one variable is the whole of "push somewhere else". Override it in
  # Settings → CI/CD → Variables; a registry other than this project's own
  # also needs its own credentials (see the login step).
  STARCUBES_IMAGE: $CI_REGISTRY_IMAGE

  # The generic package the source zip is published under.
  PKG_NAME: starcubes

  # docker-in-docker over TLS, the stock arrangement.
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/certs/client"

stages:
  - build
  - release

build:
  stage: build
  # Empty on purpose — do not delete it as dead weight. It says "this job
  # wants no tags", so any runner the project can see may take it, which is
  # what we want when the runners come from the instance rather than from
  # us. Leaving the key out entirely would mean the same thing *today*, but
  # not necessarily tomorrow: a group-level compliance pipeline or pipeline
  # execution policy merges its own configuration into every pipeline here,
  # and tags inherited that way would ask for a runner nobody has. The
  # empty list clears them. What a job really asks for is visible under
  # Build → Pipeline editor → "Full configuration".
  tags: []
  # Pinned on purpose, and on an instance with no reach to Docker Hub both
  # of these are the mirrored copies. A shell runner with podman needs
  # neither: set CONTAINER_ENGINE=podman, drop the service, and provide
  # git/python3/curl on the host instead of the apk line below.
  image: docker:28-cli
  services:
    - docker:28-dind
  before_script:
    # Every before_script and script line of a job runs in ONE shell, so a
    # variable set in one line is still there in the next — which is why
    # nothing here needs the $GITHUB_ENV dance its GitHub twin does between
    # steps. `set -e` therefore also holds for the whole job, and it has to
    # be asked for: a failing line inside a multi-line block would otherwise
    # be stepped over and the release published on top of it.
    - set -e
    # python3 for version.py (3.6+ is enough — that module is held to it),
    # git for describe and archive, curl for the package upload.
    - apk add --no-cache git python3 curl
    # The runner's checkout is not owned by the user inside this image, and
    # git refuses to read a repository it considers someone else's. It
    # refuses quietly as far as version.py is concerned — every git call in
    # that module is best-effort — so without this the version resolves to
    # `unknown` and the guard below reports a version problem for what is
    # really a permission one.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - |
      # ---- the version, from version.py rather than from the tag ---------
      tag="$CI_COMMIT_TAG"
      version=$(python3 -c 'from starcubes.version import __version__; print(__version__)')
      case "$version" in
        "" | "unknown")
          echo "version.py could not resolve a version — is the tag history here?" >&2
          echo "  (GIT_DEPTH must be 0: a shallow clone has no tag to describe)"   >&2
          exit 1 ;;
        "${tag#v}") ;;
        *)
          echo "version.py says '$version', but the tag is '$tag'" >&2
          echo "  — refusing to publish a release whose version and tag disagree" >&2
          exit 1 ;;
      esac
      # Same rule as version.py._is_prerelease: a hyphen before the '+'
      case "${version%%+*}" in
        *-*) prerelease=true  ;;
        *)   prerelease=false ;;
      esac
      echo "releasing starcubes $version (pre-release: $prerelease)"
    - |
      # ---- the changelog, before anything expensive ----------------------
      # A temp dir outside the checkout: version.py reads `git status` when
      # build.sh runs, and an untracked file in the workspace would silently
      # tag the image `…+dirty`. Only the handover to the release job goes
      # through the workspace, and that directory is gitignored.
      tmp=$(mktemp -d)
      awk -v v="$version" '
        index($0, "## [" v "]") == 1 { on = 1; print; next }
        on && substr($0, 1, 3) == "## " { exit }
        on
      ' CHANGELOG.md > "$tmp/notes.md"
      test -s "$tmp/notes.md" || {
        echo "CHANGELOG.md has no '## [$version]' section —" >&2
        echo "  write it and commit it before tagging (docs/releases.md, step 2)" >&2
        exit 1
      }
    - |
      # ---- build ---------------------------------------------------------
      ./docker/build.sh
    - |
      # ---- push ----------------------------------------------------------
      # These credentials are the project's own registry. Pointing
      # STARCUBES_IMAGE at a different one means supplying that registry's
      # login here (a masked, protected variable, or DOCKER_AUTH_CONFIG).
      docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      docker tag "starcubes:$version" "$STARCUBES_IMAGE:$version"
      docker push "$STARCUBES_IMAGE:$version"
      # :latest says "the newest final release" — a beta must not move it
      if [ "$prerelease" = false ]; then
        docker tag "starcubes:$version" "$STARCUBES_IMAGE:latest"
        docker push "$STARCUBES_IMAGE:latest"
      fi
    - |
      # ---- the source zip ------------------------------------------------
      # Packed from the tag, so the export-subst placeholders in
      # version.py name the version with no .git in the archive.
      zip_name="starcubes-$version.zip"
      git archive --format=zip "$tag" -o "$tmp/$zip_name"
      # A GitLab release links to assets, it does not host them, so the zip
      # needs a home first. The generic package registry is that home.
      zip_url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PKG_NAME/$version/$zip_name"
      curl --fail-with-body --silent --show-error \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file "$tmp/$zip_name" "$zip_url"
    - |
      # ---- hand over to the release job ----------------------------------
      # Written only now that build.sh has run and the version is settled.
      # .release/ is gitignored for the same reason the temp dir is outside
      # the checkout: an untracked file here means a `+…dirty` version.
      mkdir -p .release
      cp "$tmp/notes.md" .release/notes.md
      name="starcubes $version"
      if [ "$prerelease" = true ]; then name="$name (pre-release)"; fi
      {
        echo "VERSION=$version"
        echo "PRERELEASE=$prerelease"
        echo "RELEASE_NAME=$name"
        echo "ZIP_NAME=$zip_name"
        echo "ZIP_URL=$zip_url"
      } > .release/build.env
  artifacts:
    paths:
      - .release/notes.md
    reports:
      # The GitLab equivalent of $GITHUB_ENV: these become variables in the
      # release job, so it never has to resolve the version a second time.
      dotenv: .release/build.env

publish:
  stage: release
  tags: []          # same reason as in `build` above
  # release-cli is what the `release` keyword below needs; nothing else in
  # this job runs. On an instance without internet, mirror that image and
  # point this line at the mirror.
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build
      artifacts: true
  script:
    - echo "publishing $RELEASE_NAME"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $RELEASE_NAME
    # release-cli reads a path here as a file. There is no pre-release flag
    # to set: the name carries it, and the image's :latest tag is what
    # actually keeps a beta out of an operator's way.
    description: .release/notes.md
    assets:
      links:
        - name: $ZIP_NAME
          url: $ZIP_URL
          link_type: package
