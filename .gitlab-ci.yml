# The release pipeline, GitLab side. Its GitHub twin is
# .github/workflows/release.yml, and the two are deliberately kept in step
# where it counts: same guards, same order, same output — a `v*` tag publishes
# an image, a source zip packed from the tag, and a release whose body is the
# tag's own CHANGELOG.md section.
#
# **What changed, and why.** The image used to be built here: buildah on the
# Kubernetes shared runner, pushed to Harbor with credentials kept as CI
# variables. It is now built by the **OCI Builder**
# (`paas/oci-builder/pipelines/builder`), a central service that clones this
# repository, builds it, pushes it with credentials of its own and signs it
# with cosign — so this project no longer holds a registry password at all.
# The builder is reached through `trigger:` jobs, and that is why several jobs
# below have no `script:`: a trigger job cannot have one, so the work this file
# used to do in one job now spans three.
#
# starcubes/version.py stays the one definition of what a version is: the
# `prepare` job asks it — not the tag name — and stops unless the two agree.
# The changelog guard runs there too, before anything is built, so a missing
# section costs a minute rather than a full image build.
#
# **Three of the four builder actions are proven, one is not.** `build` has run
# end to end (2026-09-28, pipeline 19872671): the internal base pulls, the
# packages install, npm and PyPI answer, the build args arrive, the image is
# pushed and signed. **`promote` and `tag` have never been run from here** —
# they are written from the builder's own sources (`includes/promote_image.yaml`,
# `includes/manage_tags.yaml` and the `libs/` scripts they call), and the first
# real tag is their test. `docs/releases.md`, "GitLab — .gitlab-ci.yml", says
# so where an operator will look.
#
# Three further things GitLab does differently, all of them handled below
# rather than papered over:
#   * a release carries links, not file uploads — the zip goes into the
#     generic package registry and is linked from the release;
#   * there is no pre-release flag — the name says it, and `:latest` is what
#     actually keeps a beta from being pulled by accident;
#   * artifacts must live inside $CI_PROJECT_DIR, which is the checkout —
#     see the note on .release/ in the `prepare` job.

# Two ways in, and no branch pushes. A `v*` tag runs the release; a pipeline
# started by hand from the UI (Build → Pipelines → Run pipeline) runs nothing
# but `doctor`, which publishes nothing. Everything else stays out: the file is
# one release procedure, and a job that cannot resolve a tag cannot run any of
# it.
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  # version.py asks `git describe --abbrev=0 --match 'v[0-9]*'`, which needs
  # the tag history. GitLab clones shallow by default, and a shallow clone
  # resolves the version to `unknown` — the guard would then stop the release
  # for what is really a checkout setting. Full depth, always.
  GIT_DEPTH: "0"

  # The image the two shell jobs run in. Docker Hub's full python image, which
  # the runner pulls through its Artifactory mirror. Full, not -slim: the full
  # image already carries git and curl, and both are needed — `git archive`
  # packs the zip, and version.py describes the tag.
  #
  # It is no longer needed for buildah: nothing here builds an image any more.
  # See docs/releases.md for what the internal `wl-u10-python312` lacks (a
  # package manager) and why that kept it out of this slot.
  STARCUBES_JOB_IMAGE: python:3.12

  # What the builder is told to build. These two are the whole of "where the
  # image goes": the name it gets, and the object code whose Harbor namespace
  # it lands in — the builder lowercases that to `starcubes`.
  OCI_IMAGE_NAME: "starcubes"
  OCI_APPLICATION_SERVICE: "Starcubes"

  # Which Dockerfile the builder builds, **as a path inside this repository**.
  #
  # `docker/Dockerfile.ubi` and not the root `Dockerfile`: the builder's
  # security linter accepts a source image only from a handful of internal
  # registries, and the root file's bases come from Docker Hub. The UBI file
  # builds the same image on the internal UBI 10 base instead.
  #
  # The whole path belongs here. `DOCKERFILE_DIR` is set to the empty string at
  # the trigger, because the builder uses it as the build **context** as well
  # as the directory — `docker` there would make `COPY . /app/` copy only that
  # subdirectory, and the image would build and be wrong.
  OCI_DOCKERFILE: "docker/Dockerfile.ubi"

  # The default for the overwrite switch the two trigger jobs pass on as
  # `FORCE`. It is spelled out here because **an empty FORCE is an error, not
  # an "off"**: the builder reads it with a strict boolean parser that knows
  # only yes/1/true/no/0/false, and GitLab expands an undefined variable to the
  # empty string. Without this line, deleting the project variable would not
  # restore the overwrite protection — it would stop the build with
  # "Error while reading FORCE argument value : , please check documentation"
  # before anything was built.
  #
  # A project variable of the same name still wins over this default: set
  # `OCI_FORCE_OVERWRITE=True` for the one case that needs it, and remove it
  # again afterwards. The two reasons are written out at the `FORCE:` lines.
  OCI_FORCE_OVERWRITE: "False"

default:
  image: $STARCUBES_JOB_IMAGE
  # These tags reach the k8s shared runner. A job that sits in "pending"
  # forever is usually this line or a protected-tag mismatch;
  # docs/releases.md, "This job is stuck", has both cases.
  tags: [docker-S, kazan-S]

stages:
  - check
  - build
  - release

# What a shell job needs before it can do anything. The checkout is not owned
# by the user inside this image, and git refuses to read a repository it
# considers someone else's. It refuses quietly as far as version.py is
# concerned — every git call in that module is best-effort — so without this
# the version resolves to `unknown` and a guard reports a version problem for
# what is really a permission one.
#
# Included as `- *setup`, which nests a list inside the script list. GitLab
# flattens that — it is the anchor-for-scripts pattern out of its own
# documentation — but a YAML parser shows it as a list in a list, which is
# worth knowing before anyone "fixes" it.
.setup: &setup
  - |
    set -e
    echo "── this pod ──────────────────────────────────────────────────"
    echo "  image     $STARCUBES_JOB_IMAGE"
    echo "  ref       ${CI_COMMIT_TAG:-${CI_COMMIT_REF_NAME:-?}}"
    echo "  commit    ${CI_COMMIT_SHORT_SHA:-?}"
    git config --global --add safe.directory "$CI_PROJECT_DIR"
    printf '  python    %s\n' "$(python3 --version 2>&1)"
    printf '  git       %s\n' "$(git --version 2>&1)"

# ---- prepare -----------------------------------------------------------------
# Everything that has to be true *before* an image is built, plus the two
# things only this side can produce: the changelog body and the source zip. It
# builds nothing — the name says what it does, and the image job that follows
# is the one that spends real time.
prepare:
  stage: check
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  before_script:
    - *setup
  script:
    - |
      # ---- the version, from version.py rather than from the tag ---------
      tag="$CI_COMMIT_TAG"
      version=$(python3 -c 'from starcubes.version import __version__; print(__version__)')
      case "$version" in
        "" | "unknown")
          echo "version.py could not resolve a version — is the tag history here?" >&2
          echo "  (GIT_DEPTH must be 0: a shallow clone has no tag to describe)"   >&2
          exit 1 ;;
        "${tag#v}") ;;
        *)
          echo "version.py says '$version', but the tag is '$tag'" >&2
          echo "  — refusing to publish a release whose version and tag disagree" >&2
          exit 1 ;;
      esac
      # Same rule as version.py._is_prerelease: a hyphen before the '+'
      case "${version%%+*}" in
        *-*) prerelease=true  ;;
        *)   prerelease=false ;;
      esac
      echo "releasing starcubes $version (pre-release: $prerelease)"
    - |
      # ---- the changelog, before anything expensive ----------------------
      # A temp dir outside the checkout: version.py reads `git status` when
      # build.sh runs, and an untracked file in the workspace would silently
      # tag the image `…+dirty`. Only the handover to the release job goes
      # through the workspace, and that directory is gitignored.
      tmp=$(mktemp -d)
      awk -v v="$version" '
        index($0, "## [" v "]") == 1 { on = 1; print; next }
        on && substr($0, 1, 3) == "## " { exit }
        on
      ' CHANGELOG.md > "$tmp/notes.md"
      test -s "$tmp/notes.md" || {
        echo "CHANGELOG.md has no '## [$version]' section —" >&2
        echo "  write it and commit it before tagging (docs/releases.md, step 2)" >&2
        exit 1
      }
    - |
      # ---- the source zip ------------------------------------------------
      # Packed from the tag, so the export-subst placeholders in version.py
      # name the version with no .git in the archive.
      zip_name="starcubes-$version.zip"
      git archive --format=zip "$tag" -o "$tmp/$zip_name"
      # A GitLab release links to assets, it does not host them — so the zip
      # needs a home, and this instance has **no package registry**: the
      # generic packages endpoint answers 404 (measured 2026-09-28, while
      # `releases` and `jobs/artifacts` both answer). The zip's home is this
      # job's own artifact, and the URL below is what the release links to.
      # It is fixed for the tag, so a retry produces the same link; what it
      # does not survive is artifact expiry, which is why the retention below
      # is years rather than the project default.
      mkdir -p .release
      cp "$tmp/$zip_name" ".release/$zip_name"
      zip_url="$CI_PROJECT_URL/-/jobs/artifacts/$tag/raw/.release/$zip_name?job=prepare"
    - |
      # ---- hand over to the image job ------------------------------------
      # Written only now that every guard has passed. `.release/` is gitignored
      # for the same reason the temp dir is outside the checkout: an untracked
      # file here would mean a `+…dirty` version.
      mkdir -p .release
      cp "$tmp/notes.md" .release/notes.md
      name="starcubes $version"
      if [ "$prerelease" = true ]; then name="$name (pre-release)"; fi
      {
        echo "VERSION=$version"
        echo "PRERELEASE=$prerelease"
        echo "RELEASE_NAME=$name"
        echo "ZIP_NAME=$zip_name"
        echo "ZIP_URL=$zip_url"
        # The builder stamps the image with a build date it reads from here
        # rather than from its own clock: the date belongs to the release, and
        # the image's identity is what the About dialog reports.
        echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      } > .release/build.env
  artifacts:
    # The whole directory, not just the notes: it carries the source zip the
    # release links to as well. It is gitignored, and it is written only after
    # version.py has already been asked for the version — an untracked file in
    # the workspace would otherwise have made that version `…+dirty`.
    paths:
      - .release/
    # The zip is a release asset, so it has to outlive the default retention.
    expire_in: 5 years
    reports:
      # The GitLab equivalent of $GITHUB_ENV: these become variables in every
      # job that needs this one, so none of them resolves the version again.
      dotenv: .release/build.env

# ---- build-image -------------------------------------------------------------
# **Not called `image`**, though that is what it is: `image` is a reserved
# word at the top level of a GitLab pipeline (the default image every job
# runs in), so a job of that name is read as that keyword instead. The config
# then validates as a malformed global image and the pipeline comes up with
# **no jobs at all** — status `failed`, `yaml_errors: null`, nothing to read.
# Cost: one release tag, 2026-09-28.
#
# The build itself, delegated. Everything this job knows it says in
# `variables:` — a trigger job cannot run a script, so there is nowhere else to
# put it, and a variable that arrives empty is not an error the builder
# reports. That is why the whole build-arg string is composed here in one
# piece: `BUILDER_BUILD_ARGS` is the builder's own syntax, `buildarg-KEY=VALUE`
# pairs joined with `&` (not Docker's `--build-arg`), and a pair whose value is
# empty is **silently dropped** — the Dockerfile's identity guard would then
# report a missing version, which is the wrong diagnosis for a variable that
# never arrived.
#
# `GIT_BRANCH` takes the tag. The builder runs `git checkout $GIT_BRANCH`, and
# git takes a tag there as happily as a branch — building the tag is what makes
# the image the tagged commit rather than the tip of a branch.
build-image:
  stage: build
  needs: [prepare]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  variables:
    ACTION: "build"
    IMAGE_NAME: "$OCI_IMAGE_NAME"
    TAG: "$VERSION"
    OBJECT_CODE: "$OCI_APPLICATION_SERVICE"
    GIT_REPO_URL: "$CI_PROJECT_URL.git"
    GIT_BRANCH: "$CI_COMMIT_TAG"
    DOCKERFILE: "$OCI_DOCKERFILE"
    DOCKERFILE_DIR: ""
    BUILDER_BUILD_ARGS: "buildarg-STARCUBES_VERSION=$VERSION&buildarg-STARCUBES_BUILD_REF=$CI_COMMIT_SHORT_SHA&buildarg-STARCUBES_BUILD_DATE=$BUILD_DATE"
    # Off unless someone turns it on, and deliberately so. The builder refuses
    # to overwrite a tag that already exists, and its own configuration says
    # why: were the flag permanent, it would be set everywhere and the
    # protection would be gone for every build. A release tag that is already
    # on the registry therefore means *someone has published this version* —
    # something to look at, not to steamroll.
    #
    # Set `OCI_FORCE_OVERWRITE=True` in the project's CI/CD variables for the
    # one case that needs it: re-cutting a tag whose release was botched, where
    # the existing image is known to be junk. Remove it again afterwards.
    FORCE: "$OCI_FORCE_OVERWRITE"
  trigger:
    project: paas/oci-builder/pipelines/builder
    strategy: depend

# ---- promote -----------------------------------------------------------------
# Staging to production. The builder's `build` leaves the image in the STG
# registry; an operator pulls from PRD, which is the registry this project
# pushed to directly before the switch — so without this step a release would
# exist and be unpullable.
#
# Pre-releases are promoted too, deliberately: before the switch a beta landed
# in the same Harbor a final release did, and only `:latest` distinguished
# them. Moving betas to staging as well would be a second behaviour change on
# top of the new registry path, and one change at a time is easier to reason
# about. `BLOCK_PROMOTE` is the builder's switch if that ever needs to change.
promote:
  stage: release
  # `prepare` as well as `build-image`, and not for its artifacts alone: `$VERSION`
  # is a dotenv variable, and a job sees only the variables of the jobs it
  # names in `needs`. Without it the trigger would carry an empty `TAG`, and
  # the builder answers an empty mandatory variable with a message about the
  # variable rather than about this file.
  needs: [prepare, build-image]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  variables:
    ACTION: "promote"
    IMAGE_NAME: "$OCI_IMAGE_NAME"
    TAG: "$VERSION"
    OBJECT_CODE: "$OCI_APPLICATION_SERVICE"
    # The same switch as `build-image`, and for the same reason: promotion
    # checks the *target* registry, so re-cutting a botched tag would stop
    # here instead of there. It stays off unless someone sets it.
    FORCE: "$OCI_FORCE_OVERWRITE"
  trigger:
    project: paas/oci-builder/pipelines/builder
    strategy: depend

# ---- latest ------------------------------------------------------------------
# `:latest` says "the newest final release" — a beta must not move it. The
# distinction is drawn by a regex on the tag rather than by the `$PRERELEASE`
# flag `prepare` computes, and that is not a shortcut: `rules:` are evaluated
# when the pipeline is created, long before any dotenv artifact exists. The
# regex states the same rule version.py does — a hyphen before the build
# metadata means "on the way to a release", not "a release".
#
# `REGISTRY: PRD` because that is where an operator pulls from. The image is in
# both after the promotion; tagging only the staging copy would leave
# `:latest` pointing at a registry nobody reads.
latest:
  stage: release
  # `prepare` for the same reason `promote` needs it: `$VERSION` comes from its
  # dotenv artifact, and `needs` is what decides which artifacts a job sees.
  needs: [prepare, promote]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  variables:
    ACTION: "tag"
    IMAGE_NAME: "$OCI_IMAGE_NAME"
    OBJECT_CODE: "$OCI_APPLICATION_SERVICE"
    TAG: "$VERSION"
    NEW_TAG: "latest"
    REGISTRY: "PRD"
  trigger:
    project: paas/oci-builder/pipelines/builder
    strategy: depend

# ---- publish -----------------------------------------------------------------
publish:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  needs:
    - job: prepare
      artifacts: true
    # Not `latest`: that job does not exist for a pre-release, and a `needs`
    # on a job that never ran would hold this one back. Promotion is the last
    # step a release cannot do without.
    - job: promote
  before_script:
    - *setup
  script:
    - |
      # The `release:` keyword would be the obvious way to do this, but it is
      # implemented by the release-cli image, and this instance has no such
      # image. The Releases API is the same thing one layer down: same tag,
      # same name, same description, same asset link — and there is still no
      # pre-release flag to set, because GitLab releases have none. The name
      # carries it, and the image's :latest tag is what actually keeps a beta
      # out of an operator's way.
      echo "publishing $RELEASE_NAME"
      tmp=$(mktemp -d)
      # Two bodies, built with python3 rather than printf: a changelog
      # section is full of backticks, quotes and newlines, and hand-rolled
      # JSON in sh breaks on the first of them. json.dumps is stdlib.
      #
      # Two, because creating and updating a release do not take the same
      # thing: POST accepts assets.links, PUT does not — links are their own
      # sub-resource once a release exists.
      python3 - "$tmp/create.json" "$tmp/update.json" <<'PY'
      import json, os, sys

      with open(".release/notes.md", encoding="utf-8") as fh:
          notes = fh.read()

      common = {
          "tag_name":    os.environ["CI_COMMIT_TAG"],
          "name":        os.environ["RELEASE_NAME"],
          "description": notes,
      }
      create = dict(common, assets={"links": [{
          "name":      os.environ["ZIP_NAME"],
          "url":       os.environ["ZIP_URL"],
          # "other", not "package": the target is a job artifact. GitLab
          # accepts only other/runbook/image/package here, and none of the
          # other three is true either.
          "link_type": "other",
      }]})

      for path, payload in ((sys.argv[1], create), (sys.argv[2], common)):
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(payload, fh)
      PY
      api="$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
      code=$(curl --silent --show-error --output "$tmp/resp" --write-out '%{http_code}' \
                  --request POST \
                  --header "JOB-TOKEN: $CI_JOB_TOKEN" \
                  --header "Content-Type: application/json" \
                  --data-binary "@$tmp/create.json" "$api")
      case "$code" in
        20*)
          echo "release created" ;;
        409)
          # The tag already carries a release. That is the normal state when
          # a tag is moved and pushed again to re-run this pipeline, so it is
          # an update, not an error.
          echo "release exists — updating it"
          curl --fail-with-body --silent --show-error \
               --request PUT \
               --header "JOB-TOKEN: $CI_JOB_TOKEN" \
               --header "Content-Type: application/json" \
               --data-binary "@$tmp/update.json" "$api/$CI_COMMIT_TAG" > /dev/null
          echo "release updated" ;;
        *)
          echo "the Releases API answered $code:" >&2
          cat "$tmp/resp" >&2
          exit 1 ;;
      esac

# ---- doctor ------------------------------------------------------------------
# Everything this pipeline can check about itself, without publishing anything
# or building an image. Start it by hand: Build → Pipelines → Run pipeline, on
# any ref.
#
# It is a weaker instrument than it was. The questions that used to matter —
# can this pod build, does the registry accept our credentials — are the OCI
# Builder's to answer now, and no job here can ask them. What is left is what
# this repository can still get wrong on its own.
doctor:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - *setup
  script:
    - |
      failed=0
      ok()   { printf '  ok    %s\n' "$1"; }
      bad()  { printf '  FAIL  %s\n' "$1"; failed=$((failed + 1)); }
      note() { printf '        %s\n' "$1"; }

      echo "── 1. this repository ────────────────────────────────────────"
      v=$(python3 -c 'from starcubes.version import __version__; print(__version__)' 2>/dev/null || echo unknown)
      if [ "$v" = unknown ]; then
        bad "version.py resolves to 'unknown' — no tag history in this clone"
        note "GIT_DEPTH must be 0; it is set, so this would be a clone problem"
      else
        ok "version.py resolves: $v"
      fi
      grep -q '^## \[Unreleased\]' CHANGELOG.md \
        && ok "CHANGELOG.md has an [Unreleased] section" \
        || bad "CHANGELOG.md has no [Unreleased] section"
      test -f "$OCI_DOCKERFILE" && ok "$OCI_DOCKERFILE is here" \
                                || bad "$OCI_DOCKERFILE is missing"

      echo "── 2. what a release would send the builder ──────────────────"
      note "image      $OCI_IMAGE_NAME:<\$VERSION>"
      note "namespace  $(printf '%s' "$OCI_APPLICATION_SERVICE" | tr '[:upper:]' '[:lower:]')"
      note "dockerfile $OCI_DOCKERFILE"
      note "repo       $CI_PROJECT_URL.git"

      echo "── 3. the builder ────────────────────────────────────────────"
      # A note, not a check — and that distinction cost a release tag to learn
      # (2026-09-28). Whether `build-image` may trigger the OCI Builder depends
      # on **who started this pipeline**: GitLab checks the pipeline user's
      # permission on the downstream project, and the job token on its own
      # never sees it. So a 404 here is also what a pipeline that triggers
      # perfectly well answers — a web pipeline started by a member of the
      # builder project goes through, one started by a project access token
      # fails with `insufficient_bridge_permissions`.
      #
      # What the answer does tell you: **200** means the job token is on the
      # builder's allowlist and every push triggers reliably; **404** means the
      # tag has to be pushed by a user the builder knows.
      api="$CI_API_V4_URL/projects/paas%2Foci-builder%2Fpipelines%2Fbuilder"
      if curl --silent --show-error --fail --max-time 20 --output /dev/null \
           --header "JOB-TOKEN: $CI_JOB_TOKEN" "$api"; then
        ok "the trigger project answers this job's token — any push can trigger it"
      else
        note "the trigger project is invisible to this job's token"
        note "that is not by itself a failure: the trigger is allowed when the"
        note "pipeline was started by a member of the builder project, and a"
        note "tag pushed by a project access token was not — it fails with"
        note "insufficient_bridge_permissions. See docs/releases.md."
      fi

      echo "── 4. what this job cannot check ─────────────────────────────"
      note "the build itself. Only a tag does that: the base image, the"
      note "package installs, npm, PyPI and the build args are the OCI"
      note "Builder's to run, and it runs them on its own infrastructure."
      note "A cheap rehearsal is a throwaway branch whose .gitlab-ci.yml"
      note "triggers ACTION=build with TAG=probe — that is how this file"
      note "was written in the first place."

      echo
      if [ "$failed" -eq 0 ]; then
        echo "all checks passed — a v* tag has everything it needs"
      else
        echo "$failed check(s) failed — fix these before tagging a release" >&2
        exit 1
      fi
